[alembic]
script_location = alembic
#sqlalchemy.url = postgresql+asyncpg://postgres:123456@localhost:5434/postgres
prepend_sys_path = .
version_locations = %(here)s/versions
file_template = %%(rev)s_%%(slug)s
revision_environment = false
recursive_version_locations = false
output_encoding = utf-8

[post_write_hooks]
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S