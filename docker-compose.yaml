services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrator:
    build: .
    command: alembic upgrade head
    environment:
      postgres_url: postgresql+asyncpg://postgres:123456@postgres:5432/postgres
    depends_on:
      postgres:
        condition: service_healthy